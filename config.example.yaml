# OpenWrt Binary Update Manager 配置文件

config:
  log: /tmp/updater/updater.log          # 日志文件路径
  status: /tmp/updater/updater.status    # 状态文件路径（JSON 格式）
  working-dir: /tmp/updater              # 工作目录（下载和解压的临时文件）
  token: ""                              # 可选：GitHub Personal Access Token
                                         # 无认证速率限制 60 次/小时，有 Token 可达 5000 次/小时
  language: ""                           # 可选：语言设置 (en_us / zh_cn)，留空自动检测
  concurrency: 4                         # 可选：并发请求数（默认 4）
  timeout: 30                            # 可选：API 请求超时秒数（默认 30）
  download_timeout: 600                  # 可选：下载超时秒数（默认 600）
  retry: 2                               # 可选：请求失败重试次数（默认 2）

monitors:
  # ── qBittorrent Enhanced Edition ──────────────────────
  qBittorrent-ee:
    file: /usr/bin/qBittorrent-nox           # 目标二进制路径
    interval: 6h                             # 检查间隔（s/m/h/d）
    proxy: ""                                # 可选：HTTP 镜像前缀（如 https://gh-proxy.com/）
                                             #       或 socks5 代理（如 socks5://127.0.0.1:1080）
    regex: "^qbittorrent-enhanced-nox_x86_64-linux-musl_static\\.zip$"  # 匹配 asset 文件名
    repo: c0re100/qBittorrent-Enhanced-Edition  # GitHub 仓库（owner/repo）
    type: latest                             # latest 或 pre-release
    extract_path: "qbittorrent-nox"          # 可选：存档内要提取的文件路径，支持 {tag} / {version} 变量
    pre_update: |                                   # 替换前执行的脚本（支持多行）
      /etc/init.d/qbittorrent stop
      sleep 2
      killall qbittorrent-nox || true
    post_update: |                                   # 替换后执行的脚本（支持多行）
      /etc/init.d/qbittorrent restart
      sleep 1
      logger "qBittorrent updated successfully"
    version_check:                           # 可选：本地版本检测
      command: "/usr/bin/qBittorrent-nox --version"  # 获取本地版本号的命令
      regex: "qBittorrent v([0-9.]+)"        # 提取版本号的正则（需包含一个捕获组）
      strip_prefix: "release-"               # 可选：比较前去除远程 tag 的前缀
    backup:                                  # 可选：备份配置
      enabled: true                          # 是否启用备份
      dir: /tmp/updater/backups              # 备份保存目录
      count: 3                               # 保留份数（超出自动删除最旧的）

